<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mindustry Mod HJSON Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Mindustry Item Mod Generator</h1>

  <div class="container">
    <!-- 入力フォームエリア -->
    <form id="modForm">
      <div class="form-group">
        <label for="name">内部ID (name):</label>
        <input type="text" id="name" value="new-item" required>
      </div>

      <div class="form-group">
        <label for="displayName">表示名 (displayName):</label>
        <input type="text" id="displayName" value="New Item">
      </div>

      <div class="form-group">
        <label for="description">説明 (description):</label>
        <textarea id="description">A useful custom item.</textarea>
      </div>

      <div class="form-group">
        <label for="cost">コスト (cost):</label>
        <input type="number" id="cost" value="1.0" step="0.1">
      </div>

      <div class="form-group">
        <label for="color">カラーコード (color):</label>
        <input type="color" id="color" value="#ff0000">
      </div>
    </form>

    <!-- 出力・コピペエリア -->
    <div class="output-group">
      <label for="output">生成されたHJSON:</label>
      <textarea id="output" readonly></textarea>
      <button id="copyBtn">クリップボードにコピー</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
